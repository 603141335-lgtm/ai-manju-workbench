name = "dudu-ai-license"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "dudu-license"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
PRODUCT_ID = "dudu-ai-workbench"

[secrets]
required = ["DUDU_SIGNING_PRIVATE_PKCS8_B64", "DUDU_DEVICE_HMAC_KEY", "DUDU_CARD_HMAC_KEY", "DUDU_ADMIN_TOKEN_SHA256"]

[triggers]
crons = ["*/5 * * * *"]
