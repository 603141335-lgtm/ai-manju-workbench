appId: com.manju.workbench.desktop
productName: 豆包创作舱
asar: true
compression: maximum
directories:
  output: ../dist-doubao
files:
  - "main.js"
  - "preload.js"
  - "renderer.js"
  - "parser.js"
  - "index.html"
  - "style.css"
  - "drag-test.html"
  - "drag.png"
  - "package.json"
  - "node_modules/**/*"
  - "!**/*.map"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/*.md"
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
