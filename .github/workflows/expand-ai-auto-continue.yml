name: Expand AI Auto Continue v0.5 source
on:
  push:
    branches:
      - ai-auto-continue-v0.5-mint
    paths:
      - .github/workflows/expand-ai-auto-continue.yml
      - ai-auto-continue-v0.5/AI_Auto_Continue_v0.5_MintTheme_Edge_Chrome.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ai-auto-continue-v0.5-mint
      - name: Expand source ZIP in place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-v05"
          unzip -oq "ai-auto-continue-v0.5/AI_Auto_Continue_v0.5_MintTheme_Edge_Chrome.zip" -d "$RUNNER_TEMP/ai-v05"
          test -f "$RUNNER_TEMP/ai-v05/AI_Auto_Continue_v0.5_MintTheme/manifest.json"
          cp -a "$RUNNER_TEMP/ai-v05/AI_Auto_Continue_v0.5_MintTheme/." "ai-auto-continue-v0.5/"
      - name: Commit expanded files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai-auto-continue-v0.5
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "backup: expand AI Auto Continue v0.5 source files"
            git push origin HEAD:ai-auto-continue-v0.5-mint
          fi
