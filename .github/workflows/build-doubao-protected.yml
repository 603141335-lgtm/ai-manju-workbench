name: Build Doubao Studio v1.1.0 Windows Installer
on:
  push:
    branches:
      - release/doubao-no-canvas-protected-v1.1.0
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'electron-builder-doubao.yml'
      - '.github/workflows/build-doubao-protected.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Test unmodified business logic and canvas absence
        run: |
          node tests/test_parser.js
          node tests/test_main_mock.js
          node tests/test_no_canvas.js
      - name: Production JavaScript hardening
        run: node scripts/harden.js
      - name: Test hardened parser and import/export behavior
        run: |
          node tests/test_parser.js
          node tests/test_main_mock.js
          node tests/test_no_canvas.js
      - name: Prepare optional HTTPS update feed
        env:
          DOUBAO_UPDATE_URL: ${{ vars.DOUBAO_UPDATE_URL }}
        run: node scripts/prepare-update-feed.js
      - name: Build NSIS x64 installer
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --win nsis --x64 --config ../electron-builder.release.yml --publish never
      - name: Validate Windows output and hashes
        run: |
          $files = @(Get-ChildItem 'dist-doubao' -Filter '*Setup*.exe' -File)
          if ($files.Count -lt 1) { throw 'No NSIS installer generated.' }
          foreach ($f in $files) { if ($f.Length -lt 15000000) { throw "Suspiciously small installer: $($f.Name)" } }
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content 'dist-doubao/SHA256SUMS.txt'
          Get-Content 'dist-doubao/SHA256SUMS.txt'
          Write-Host 'Commercial binary packer: NOT APPLIED (license/native component not configured).'
      - name: Publish NSIS installer as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: doubao-v1.1.0
          target_commitish: ${{ github.sha }}
          name: 豆包创作舱 v1.1.0（无画布·基础加固）
          prerelease: true
          draft: false
          body: |
            Windows x64 NSIS 安装程序，保留原 com.manju.workbench.desktop 应用身份。
            通过 JS 混淆、ASAR 完整性验证、Electron Fuses 加固。
            **本版本尚未进行 Themida/VMProtect 商业加壳，也未完成 Windows 真机升级验证。**
            原有工作台数据迁移、参考图匹配与多选拖拽已通过自动模拟测试。
            未配置在线更新 HTTPS 发布源时，可使用此安装包手动原位覆盖升级。
          files: |
            dist-doubao/*Setup*.exe
            dist-doubao/SHA256SUMS.txt
            dist-doubao/*.yml
            dist-doubao/*.blockmap
          fail_on_unmatched_files: false
