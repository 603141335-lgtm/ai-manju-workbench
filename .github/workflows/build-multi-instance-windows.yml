name: Build Android Multi Instance Workbench for Windows
on:
  push:
    branches:
      - android-multi-instance-workbench
    paths:
      - 'android-multi-desktop/**'
      - '.github/workflows/build-multi-instance-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Unit tests
        run: python -m unittest discover -s android-multi-desktop/source -p 'test_*.py'
      - name: Build standalone Windows EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "AndroidMultiDesk"
          --icon "android-multi-desktop/assets/icon.ico"
          --add-data "android-multi-desktop/assets/icon.ico;."
          --paths "android-multi-desktop/source"
          "android-multi-desktop/source/app.py"
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AndroidMultiDesk.exe")) { throw "EXE not found" }
          if ((Get-Item "dist/AndroidMultiDesk.exe").Length -lt 1000000) { throw "EXE too small" }
          Get-FileHash "dist/AndroidMultiDesk.exe" -Algorithm SHA256
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: AndroidMultiDesk-v1.0-Windows-EXE
          path: dist/AndroidMultiDesk.exe
          retention-days: 30
          if-no-files-found: error
