name: Multi-AI v6.1 Windows prototype
on:
  push:
    branches: [ai-chat-desktop-v6.1-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/multi-ai-v6.1-queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Queue tests
        run: npm test
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Package Windows
        run: npm run dist:win
      - name: Installer checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'dist' -Filter '*Setup*.exe')
          if ($files.Count -lt 1) { throw 'Setup.exe missing' }
          $files | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" | Out-File 'dist/SHA256SUMS.txt' -Append -Encoding utf8 }
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-AI-v6.1-Windows
          path: |
            tools/multi-ai-v6.1-queue/dist/*Setup*.exe
            tools/multi-ai-v6.1-queue/dist/SHA256SUMS.txt
          retention-days: 7
