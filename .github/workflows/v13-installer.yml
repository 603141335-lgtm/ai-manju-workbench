name: Build V1.3 Workbench Windows Installer (isolated)
on:
  push:
    branches:
      - release/v13-windows-installer-20261116
    paths:
      - '.github/workflows/v13-installer.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'release-build.json'
      - 'native-core/**'
      - 'license-service/**'
  workflow_dispatch:
  pull_request:
    branches:
      - feature/v13-workbench-stability-audit
    paths:
      - '.github/workflows/v13-installer.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require real production license endpoint and matching public key
        env:
          DUDU_LICENSE_URL: ${{ vars.DUDU_LICENSE_URL }}
          DUDU_LICENSE_PUBLIC_KEY_B64: ${{ vars.DUDU_LICENSE_PUBLIC_KEY_B64 }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DUDU_LICENSE_URL) -or [string]::IsNullOrWhiteSpace($env:DUDU_LICENSE_PUBLIC_KEY_B64)) {
            throw "Installer blocked: configure repository variables DUDU_LICENSE_URL and DUDU_LICENSE_PUBLIC_KEY_B64 after deploying and verifying your original license Worker. No demo, fake, or test credentials will be embedded."
          }
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Validate desktop and license source
        run: |
          npm run check
          npm run license:check
      - name: Prepare original brand and NSIS graphics
        run: |
          npm run brand:generate
          npm run installer:art
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce embedded help tutorial images
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright Pillow
          python -m playwright install chromium
          python scripts/generate-tutorial-screenshots.py
          $images = @(Get-ChildItem assets/tutorial -Filter 'step-*.webp' -File)
          if ($images.Count -ne 12) { throw 'Tutorial media generation failed: expected 12 pages' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build Windows Rust security core
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path native-core/Cargo.toml
          cargo test --manifest-path native-core/Cargo.toml --locked
          cargo build --manifest-path native-core/Cargo.toml --release --locked
          New-Item -ItemType Directory -Force -Path native | Out-Null
          Copy-Item native-core/target/release/dudu_core.dll native/dudu_core.node -Force
          if ((Get-Item native/dudu_core.node).Length -lt 10000) { throw 'Native addon missing or too small' }
      - name: Prepare release-only native bridge and protect source
        shell: pwsh
        run: |
          npm run native:replace
          npm run native:verify
          node scripts/harden.js
          npm run check:hardened
      - name: Include Windows FFmpeg and LGPL notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/bin | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip' -OutFile $zip -MaximumRedirection 10
          Expand-Archive $zip $dir -Force
          foreach ($n in @('ffmpeg.exe','ffprobe.exe')) {
            $f=Get-ChildItem $dir -Recurse -File -Filter $n | Select-Object -First 1
            if (-not $f) { throw "Missing $n" }
            Copy-Item $f.FullName (Join-Path 'vendor/bin' $n) -Force
          }
          Invoke-WebRequest 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.LGPLv2.1' -OutFile 'vendor/bin/COPYING.LGPLv2.1'
          Copy-Item docs/FFMPEG_NOTICE.txt vendor/bin/FFMPEG_NOTICE.txt
      - name: Verify remote authorization before embedding only public config
        env:
          DUDU_LICENSE_URL: ${{ vars.DUDU_LICENSE_URL }}
          DUDU_LICENSE_PUBLIC_KEY_B64: ${{ vars.DUDU_LICENSE_PUBLIC_KEY_B64 }}
        run: npm run license:prepare
      - name: Build complete Windows NSIS installer
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --config release-build.json --publish never
          npm run verify:release
          $exe = Get-ChildItem release -File -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 15000000) { throw 'Full Windows installer not created' }
          $dest='release/DuduAI-Workbench-Setup-V1.3-x64.exe'
          Move-Item $exe.FullName $dest -Force
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash
          "$hash  DuduAI-Workbench-Setup-V1.3-x64.exe" | Set-Content 'release/SHA256SUMS.txt'
          $sig = Get-AuthenticodeSignature $dest
          Write-Host "Authenticode status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { Write-Warning 'Installer is unsigned; Windows may show SmartScreen warning.' }
      - name: Upload full installer (no source files or production secrets)
        uses: actions/upload-artifact@v4
        with:
          name: DuduAI-Workbench-Setup-V1.3-x64
          path: |
            release/DuduAI-Workbench-Setup-V1.3-x64.exe
            release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
