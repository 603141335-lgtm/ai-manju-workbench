name: Build Android APK (two-button mobile)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-two-buttons-apk
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle -p mobile-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: manju-mobile-apk-install
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
