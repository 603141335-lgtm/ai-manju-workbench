name: Build Android Manju Studio v2 APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-v2-light
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify mobile JavaScript syntax
        run: node --check mobile-android/app/src/main/assets/studio/studio.js
      - name: Test mobile parser and exact prompt retention
        run: node mobile-android/tests/ui-parser.test.cjs
      - name: Build installable debug APK
        run: gradle -p mobile-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: manju-mobile-v2-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish directly downloadable APK (preview release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mobile-v2-light'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile-android/app/build/outputs/apk/debug/app-debug.apk AI-Manju-Studio-v2.0-debug.apk
          gh release view mobile-studio-v2.0-preview >/dev/null 2>&1 &&             gh release upload mobile-studio-v2.0-preview AI-Manju-Studio-v2.0-debug.apk --clobber ||             gh release create mobile-studio-v2.0-preview AI-Manju-Studio-v2.0-debug.apk --target "$GITHUB_SHA" --title "AI漫剧随身工作台 v2.0 测试版" --notes "专业浅色四栏APP：剧集、制作、素材与项目备份，保留一键保存本段全部参考图与一键复制原文。仅编译验证，等待手机实测。" --prerelease
