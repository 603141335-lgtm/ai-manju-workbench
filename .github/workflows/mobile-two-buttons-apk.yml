name: Build Android Manju v2.0.1 v0.3 Compatible APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-doubao-v03-compat
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/mobile-two-buttons-apk.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify mobile JavaScript syntax
        run: node --check mobile-android/app/src/main/assets/studio/studio.js
      - name: Test mobile parser and exact prompt retention
        run: node mobile-android/tests/ui-parser.test.cjs
      - name: Verify Windows v0.3 workspace compatibility
        run: |
          node --check mobile-android/app/src/main/assets/studio/studio-compat.js
          node mobile-android/tests/desktop-compat.test.cjs
      - name: Build installable debug APK
        run: gradle -p mobile-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: manju-mobile-v2.0.1-desktop-compatible-apk
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish directly downloadable APK (preview release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mobile-doubao-v03-compat'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile-android/app/build/outputs/apk/debug/app-debug.apk AI-Manju-Studio-v2.0.1-Doubao-compat.apk
          gh release view mobile-studio-v2.0.1-doubao-compat >/dev/null 2>&1 &&             gh release upload mobile-studio-v2.0.1-doubao-compat AI-Manju-Studio-v2.0.1-Doubao-compat.apk --clobber ||             gh release create mobile-studio-v2.0.1-doubao-compat AI-Manju-Studio-v2.0.1-Doubao-compat.apk --target "$GITHUB_SHA" --title "AI漫剧随身工作台 v2.0.1 豆包创作舱兼容测试版" --notes "支持离线导入豆包创作舱 v0.3 的 workspace.json，保留原始文本、集段ID与状态。参考图需另行复制到手机文件夹，尚未实现 CloudBase 自动同步，也未经真机实测。" --prerelease
