name: Multi-AI v6.1 WQ-A queue core tests
on:
  push:
    branches: [ai-chat-desktop-v6.1-wq-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test Node 22 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
