name: Deploy Dudu AI License Service (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dudu-license-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-license
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DUDU_D1_DATABASE_ID: ${{ vars.DUDU_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require separately configured owner Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$DUDU_D1_DATABASE_ID" || { echo "Missing DUDU_D1_DATABASE_ID variable"; exit 1; }
      - name: Install Wrangler CLI
        working-directory: license-service
        run: npm install --no-audit --no-fund
      - name: Run license and D1 tests
        working-directory: license-service
        run: npm test
      - name: Configure owner D1 binding
        working-directory: license-service
        run: node scripts/prepare-wrangler.mjs
      - name: Apply additive schema only
        working-directory: license-service
        run: npx wrangler d1 execute dudu-license --remote --file=schema.sql --yes --config wrangler.local.toml
      - name: Deploy with required Cloudflare secrets validated by Wrangler
        working-directory: license-service
        run: npx wrangler deploy --config wrangler.local.toml
