name: Deploy Dudu AI License Service (manual, protected)
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: "已完成原 owner-keys.json 离线备份及原 D1 全量 SQL 导出"
        required: true
        type: boolean
        default: false
      production_confirmation:
        description: "必须输入 DEPLOY_PRODUCTION_V1_3 才会继续"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dudu-license-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-license
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DUDU_D1_DATABASE_ID: ${{ vars.DUDU_D1_DATABASE_ID }}
      BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
      PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
      EXPECTED_REF: refs/heads/feature/dudu-ai-v1.2.0-license
    steps:
      - uses: actions/checkout@v4
      - name: Require the reviewed V1.3 development branch and explicit owner confirmations
        shell: bash
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF" || { echo "::error::请从 feature/dudu-ai-v1.2.0-license 分支运行部署"; exit 1; }
          test "$BACKUP_CONFIRMED" = "true" || { echo "::error::部署前必须备份原密钥并导出原 D1 数据"; exit 1; }
          test "$PRODUCTION_CONFIRMATION" = "DEPLOY_PRODUCTION_V1_3" || { echo "::error::缺少明确的生产部署确认"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require separately configured owner Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$DUDU_D1_DATABASE_ID" || { echo "::error::Missing DUDU_D1_DATABASE_ID variable"; exit 1; }
      - name: Install Wrangler CLI
        working-directory: license-service
        run: npm ci --no-audit --no-fund
      - name: Run license, commerce and syntax tests
        working-directory: license-service
        run: |
          npm test
          npm run check
      - name: Configure the explicitly supplied original D1 binding
        working-directory: license-service
        run: node scripts/prepare-wrangler.mjs
      - name: Verify Cloudflare still maps dudu-license to the exact original D1 ID
        working-directory: license-service
        run: node scripts/verify-existing-d1.mjs
      - name: Apply additive schema only after all preflight checks pass
        working-directory: license-service
        run: npx wrangler d1 execute dudu-license --remote --file=schema.sql --yes --config wrangler.local.toml
      - name: Deploy existing Worker without rotating owner or payment secrets
        working-directory: license-service
        run: npx wrangler deploy --config wrangler.local.toml
