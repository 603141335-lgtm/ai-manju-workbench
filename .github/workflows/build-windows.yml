name: Build Dudu AI Workbench v1.0.0
concurrency:
  group: "dudu-v100-${{ github.ref }}"
  cancel-in-progress: true
on:
  push:
    branches: [feature/dudu-ai-workbench-v1.0.0]
  pull_request:
    branches: [doubao-creative-hub-STABLE-v0.9.9]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate original Dudu AI icon (ICO and PNG)
        run: npm run brand:generate
      - name: Verify source, brand, data and 25-account invariants
        run: npm run check
      - name: Legacy v0.9.4 continuity before hardening
        run: node --test tests/v094.test.js
      - name: Prior 0.9.5-0.9.9 feature regressions before hardening
        run: node --test tests/v095-public.test.js tests/v096-optimized.test.js tests/v097-video-api.test.js tests/v098-concise-mentions.test.js tests/v099-community-inline.test.js tests/v100-runtime-smoke.test.js
      - name: Hardening on ephemeral checkout only
        run: node scripts/harden.js
      - name: Verify obfuscated business modules and native Doubao DOM compatibility
        run: npm run check:hardened
      - name: Fetch official-third-party LGPL FFmpeg Windows binaries for tailframes
        run: |
          New-Item -ItemType Directory -Force -Path vendor/bin | Out-Null
          $url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/ffmpeg-win64-lgpl.zip" -MaximumRedirection 10
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg-win64-lgpl.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg-bundle" -Force
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            $match=Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-bundle" -Filter $name -File -Recurse | Select-Object -First 1
            if(-not $match){throw "Missing $name from LGPL FFmpeg build"}
            Copy-Item $match.FullName "vendor/bin/$name" -Force
          }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.LGPLv2.1' -OutFile vendor/bin/COPYING.LGPLv2.1
          Copy-Item docs/FFMPEG_NOTICE.txt vendor/bin/FFMPEG_NOTICE.txt
          & "$env:GITHUB_WORKSPACE/vendor/bin/ffmpeg.exe" -version | Select-Object -First 1
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE/vendor/bin"
      - name: Verify actual tail-frame extraction (bundled FFmpeg)
        run: node --test tests/v090.test.js
      - name: Prepare remote notice endpoint (optional; may be empty)
        env:
          DOUBAO_NOTICE_URL: ${{ vars.DOUBAO_NOTICE_URL }}
        run: node scripts/prepare-public-notice.js
      - name: Prepare optional public update feed
        env:
          DOUBAO_UPDATE_URL: ${{ vars.DOUBAO_UPDATE_URL }}
        run: node scripts/prepare-feed.js
      - name: Build Windows NSIS Setup
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --config ./release-build.json --publish never
      - name: Verify installer and SHA256
        run: |
          $exe = @(Get-ChildItem release -Filter '独独AI工作台-Setup-v1.0.0-x64.exe' -File)
          if($exe.Count -ne 1 -or $exe[0].Length -lt 15000000){throw 'NSIS installer not generated'}
          $hash=(Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash
          "$hash  $($exe[0].Name)" | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
          $sig=Get-AuthenticodeSignature $exe[0].FullName
          Write-Host "Windows Authenticode signature status: $($sig.Status)"
          if($sig.SignerCertificate){Write-Host "Signer subject: $($sig.SignerCertificate.Subject)"}else{Write-Warning 'Installer is NOT digitally signed; JS obfuscation is not code signing.'}
      - name: Publish private GitHub Release (avoids Actions artifact quota)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dudu-ai-workbench-v1.0.0
          target_commitish: feature/dudu-ai-workbench-v1.0.0
          name: 独独AI工作台 v1.0.0（原有功能保留·品牌升级·安全加固）
          prerelease: true
          body: |
            独独AI工作台 v1.0.0 延续旧版公开安装身份、账号数据目录和全套漫剧创作功能。升级为原创品牌图标，更多业务模块经过 JS 混淆加固并保留 Electron ASAR/Fuses。未使用需许可证的商业壳；代码签名取决于是否配置证书。豆包网页原生@和覆盖安装仍需 Windows 登录设备验收。
          files: |
            release/独独AI工作台-Setup-v1.0.0-x64.exe
            release/SHA256SUMS.txt
            release/*.blockmap
          fail_on_unmatched_files: true
