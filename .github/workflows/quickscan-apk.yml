name: 快递快扫 | 构建安卓 APK

on:
  push:
    branches:
      - quickscan-app
      - quickscan-v0141-repair
      - quickscan-v0150-fastqueue
      - quickscan-v0160-ui
    paths:
      - 'quickscan-android/**'
      - '.github/workflows/quickscan-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickscan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: quickscan-android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify APK file
        run: |
          test -s quickscan-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum quickscan-android/app/build/outputs/apk/debug/app-debug.apk
      # GitHub Actions artifact storage is currently at its quota. Release
      # assets use GitHub Releases rather than Actions artifact storage.
      - name: Publish v0.15.0 APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=quickscan-v0.15.0-preview
          APK=quickscan-android/app/build/outputs/apk/debug/app-debug.apk
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "快递快扫 v0.15.0 测试版" \
            --notes "失败件照片集中补录、倾斜条码识别改进。注意：调试签名，仅供测试；旧版数据请勿通过卸载清理。"
          gh release upload "$TAG" "$APK#QuickScan_v0.15.0_debug.apk" --clobber
          gh release view "$TAG" --json url,assets
