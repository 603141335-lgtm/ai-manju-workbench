name: 快递快扫 | 构建安卓 APK

on:
  push:
    branches:
      - quickscan-app
      - quickscan-v0141-repair
    paths:
      - 'quickscan-android/**'
      - '.github/workflows/quickscan-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: quickscan-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK file
        run: |
          test -s quickscan-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum quickscan-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: QuickScan-Android-APK
          path: quickscan-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
