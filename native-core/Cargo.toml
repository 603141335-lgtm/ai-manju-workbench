[package]
name = "dudu_core"
version = "1.0.1"
edition = "2021"
publish = false

[lib]
name = "dudu_core"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = "symbols"
