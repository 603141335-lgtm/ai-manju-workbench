name: Multi-AI v6.1 Windows installer
on:
  push:
    branches: [ai-chat-desktop-v6.1-wq-a]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test real queue and HTTP API
        run: npm test
      - name: Install Electron builder
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        run: npm run dist:win
      - name: Check setup and hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path 'dist' -Filter '*Setup*.exe')
          if ($files.Count -lt 1) { throw 'Windows Setup.exe not generated' }
          $files | ForEach-Object { $h=Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" | Out-File -FilePath 'dist/SHA256SUMS.txt' -Append -Encoding utf8 }
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-AI-v6.1-WQ-A-Windows
          path: |
            dist/*Setup*.exe
            dist/SHA256SUMS.txt
          retention-days: 7
