<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Multi-AI 后台任务中心 v6.1</title><style>
:root{font-family:'Microsoft YaHei',system-ui,sans-serif;color:#1c2639;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5eaf2}header h1{font-size:20px;margin:0}small,aside{color:#67748a}.layout{display:grid;grid-template-columns:300px minmax(420px,1fr) 360px;gap:16px;padding:18px;max-width:1800px;margin:auto}.card{background:white;border:1px solid #e5eaf2;border-radius:14px;padding:16px;min-height:140px}h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:15px 0 8px}button{border:1px solid #cbd6ee;border-radius:8px;background:#fff;color:#244067;padding:9px 12px;cursor:pointer;font-size:13px}button.primary{background:#426bed;border-color:#426bed;color:white}button:hover{filter:brightness(.96)}button:disabled{opacity:.4;cursor:not-allowed}input,textarea,select{font:inherit;width:100%;border:1px solid #ccd5e6;border-radius:8px;padding:10px;margin:5px 0 10px}textarea{resize:vertical;min-height:86px}label{font-size:13px;font-weight:600}#source{min-height:180px}.ep-list{height:360px;overflow-y:auto} .ep{padding:9px 8px;border-bottom:1px solid #edf1f9;display:flex;justify-content:space-between;font-size:13px}.state{color:#5171a5}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.mono{white-space:pre-wrap;word-break:break-word;background:#f7faff;padding:12px;border-radius:8px;max-height:450px;overflow:auto;font-size:12px;line-height:1.65;border:1px solid #e6ebf3}.info{padding:10px;background:#eff4ff;color:#41629b;border-radius:8px;font-size:13px;line-height:1.5}#status{color:#4568a2;font-size:13px}#reply{min-height:220px} .hidden{display:none} @media(max-width:1200px){.layout{grid-template-columns:260px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.layout{display:block}.card{margin-bottom:14px}}</style></head><body>
<header><div><h1>Multi-AI Chat Desktop · 后台任务中心</h1><small>v6.1-WQ-A ｜ 真实队列与本地持久化 ｜ 网页会员人工交接</small></div><span id="status">未开始</span></header>
<div class="layout"><section class="card"><h2>创建任务</h2><label>项目名称</label><input id="title" value="我的AI漫剧30集"><label>剧集数量</label><input id="total" type="number" min="1" max="200" value="30"><label>原始小说 / 剧情总纲</label><textarea id="source" placeholder="请粘贴原始小说、人物设定或30集总纲。原文会完整保存，不自动删减。"></textarea><button class="primary" id="create">创建30集任务</button><h3>历史项目</h3><select id="jobs" size="5" style="min-height:150px"></select><h3>剧集进度</h3><div id="episodes" class="ep-list"></div></section>
<main class="card"><h2>当前执行阶段</h2><div class="toolbar"><button id="start" class="primary">开始</button><button id="pause">暂停</button><button id="resume">继续</button><button id="retry">重试当前阶段</button><button id="export">导出已完成集</button></div><h3>本次操作</h3><div class="info" id="current">创建项目后选择开始。系统逐集准备提示词，人工在官网发送并把回复完整导回。</div><h3>本阶段完整提示词（可复制）</h3><button id="copy">复制提示词</button><div class="mono" id="prompt">暂无</div></main>
<section class="card right"><h2>网页会员交接 / 质量检查</h2><div class="info">ChatGPT、Gemini 等网页版需你在官方页面自行发送和复制回复。本版本没有网页自动抓取，也不会伪造已生成。</div><h3>打开官网</h3><div class="toolbar"><button id="chatgpt">ChatGPT 官方网页</button><button id="gemini">Gemini 官方网页</button></div><h3>粘贴本阶段 AI 完整回复</h3><textarea id="reply" placeholder="完整复制官网生成的结果。每一版都会保存并校验 SHA256。"></textarea><button id="import" class="primary">导入当前阶段回复</button><h3>本集人工语义质检</h3><label>本集结束状态（人物/伏笔/道具）</label><textarea id="continuity" placeholder="填入人物状态、未解决伏笔，作为下一集承接状态"></textarea><button id="approve">确认本集剧情完整 → 进入下一集</button><h3>最近操作</h3><div id="log" class="mono">暂无</div></section></div>
<script type="module" src="/ui.js"></script></body></html>
