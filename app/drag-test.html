<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>body{font-family:'Microsoft YaHei UI',sans-serif;background:#f5f7fb;padding:22px;color:#283950}h2{margin-top:0}.drop{border:3px dashed #8ca7e7;border-radius:16px;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eaf0ff;font-size:17px}.drop.active{background:#dbebff;border-color:#2563eb}.note{font-size:12px;color:#6a7b98}#result{margin-top:14px;white-space:pre-wrap;font-size:13px;background:white;padding:13px;border-radius:9px;min-height:45px}</style></head><body><h2>本机原生拖拽验证窗口</h2><p class="note">将工作台中的「拖动本段全部图片」拖到下面的框中，检查操作系统实际传入的文件数量。</p><div id="target" class="drop">⬇<strong>把本段图片拖到这里</strong><span class="note">需要实际按住鼠标拖动，不能只点击</span></div><div id="result">尚未收到图片。</div><script>const d=document.getElementById('target'),r=document.getElementById('result');['dragenter','dragover'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add('active')}));['dragleave','drop'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.remove('active')}));d.addEventListener('drop',e=>{const fs=[...e.dataTransfer.files];r.textContent=fs.length?`已收到 ${fs.length} 个真实文件：\n`+fs.map(f=>`${f.name}｜${f.size} B`).join('\n'):'没有收到文件。请检查图片是否匹配以及是否使用鼠标拖拽。';});</script></body></html>
